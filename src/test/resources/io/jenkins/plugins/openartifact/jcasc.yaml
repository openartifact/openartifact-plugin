unclassified:
  openArtifact:
    defaultServerId: prod
    defaultInstallation: oa
    servers:
      - id: prod
        url: https://artifacts.example.com/
        credentialsId: oa-prod-token
      - id: lab
        url: http://localhost:8080

tool:
  oa:
    installations:
      - name: oa
        properties:
          - installSource:
              installers:
                - oa:
                    version: "0.10.0"
